name: Feature request
description: Propose a focused improvement to CursorPeek
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        CursorPeek prioritizes a small offline utility, predictable Explorer behavior, and safe handling of untrusted files.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest user-visible behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing Windows or Explorer behavior and any workarounds.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Note new formats, dependencies, permissions, network access, background work, or installer changes.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: The proposal keeps CursorPeek offline and does not require an account or cloud service.
          required: true

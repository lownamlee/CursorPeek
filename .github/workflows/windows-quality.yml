name: Windows quality

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Rust, tests, and release evidence
        runs-on: windows-2025
        timeout-minutes: 30

        defaults:
            run:
                shell: pwsh

        env:
            CARGO_INCREMENTAL: "0"
            CARGO_TERM_COLOR: always

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install pinned Rust toolchain
              run: |
                  $match = Select-String `
                    -LiteralPath rust-toolchain.toml `
                    -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
                  if ($match.Count -ne 1) {
                    throw "rust-toolchain.toml must declare exactly one channel."
                  }
                  $toolchain = $match.Matches[0].Groups[1].Value
                  rustup toolchain install $toolchain `
                    --profile minimal `
                    --component clippy,rustfmt `
                    --target x86_64-pc-windows-msvc `
                    --no-self-update
                  rustup override set $toolchain
                  rustc --version --verbose
                  cargo --version --verbose

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Test default features
              run: cargo test --locked --workspace

            - name: Test all features
              run: cargo test --locked --workspace --all-features

            - name: Deny Clippy warnings
              run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

            - name: Record resolved feature graph
              run: |
                  New-Item -ItemType Directory -Force target/windows-quality | Out-Null
                  cargo tree --locked --workspace -e features |
                    Tee-Object -FilePath target/windows-quality/cargo-features.txt

            - name: Build release executable
              run: cargo build --locked --release

            - name: Verify release artifact
              run: >
                  ./tools/Test-WindowsQuality.ps1
                  -Executable target/release/CursorPeek.exe
                  -OutputPath target/windows-quality/release-evidence.json

            - name: Upload release evidence
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: windows-x64-${{ github.sha }}
                  path: |
                      target/release/CursorPeek.exe
                      target/windows-quality/cargo-features.txt
                      target/windows-quality/release-evidence.json
                  if-no-files-found: error
                  retention-days: 14

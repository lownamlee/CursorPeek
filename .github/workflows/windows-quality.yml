name: Windows quality

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Rust, tests, and release evidence
        runs-on: windows-2025
        timeout-minutes: 30

        defaults:
            run:
                shell: pwsh

        env:
            CARGO_INCREMENTAL: "0"
            CARGO_TERM_COLOR: always

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install pinned Rust toolchain
              run: |
                  $match = Select-String `
                    -LiteralPath rust-toolchain.toml `
                    -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
                  if ($match.Count -ne 1) {
                    throw "rust-toolchain.toml must declare exactly one channel."
                  }
                  $toolchain = $match.Matches[0].Groups[1].Value
                  rustup toolchain install $toolchain `
                    --profile minimal `
                    --component clippy,rustfmt `
                    --target x86_64-pc-windows-msvc `
                    --no-self-update
                  rustup override set $toolchain
                  rustc --version --verbose
                  cargo --version --verbose

            - name: Check formatting
              run: |
                  cargo fmt --all -- --check
                  cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

            - name: Verify retained fuzz corpus
              run: |
                  ./tools/New-FuzzCorpus.ps1 | Out-Null
                  $changes = git status --short -- fuzz/corpus
                  if ($changes) {
                    $changes
                    throw "The retained fuzz corpus is not deterministic."
                  }

            - name: Test default features
              run: cargo test --locked --workspace

            - name: Test all features
              run: cargo test --locked --workspace --all-features

            - name: Deny Clippy warnings
              run: >
                  cargo clippy --locked --workspace --all-targets --all-features --
                  -D warnings
                  -D clippy::undocumented_unsafe_blocks

            - name: Record resolved feature graph
              run: |
                  New-Item -ItemType Directory -Force target/windows-quality | Out-Null
                  cargo tree --locked --workspace -e features |
                    Tee-Object -FilePath target/windows-quality/cargo-features.txt

            - name: Build release executable
              run: cargo build --locked --release

            - name: Enforce release performance budgets
              run: >
                  ./tools/Test-PerformanceBudget.ps1
                  -Executable target/release/CursorPeek.exe

            - name: Soak worker lifecycle recovery
              run: >
                  ./tools/Test-RecoverySoak.ps1
                  -Executable target/release/CursorPeek.exe
                  -Runs 2

            - name: Verify release artifact
              run: >
                  ./tools/Test-WindowsQuality.ps1
                  -Executable target/release/CursorPeek.exe
                  -OutputPath target/windows-quality/release-evidence.json

            - name: Build and relocate portable package
              run: |
                  ./tools/New-PortablePackage.ps1 `
                    -Executable target/release/CursorPeek.exe `
                    -OutputDirectory target/portable-first
                  ./tools/New-PortablePackage.ps1 `
                    -Executable target/release/CursorPeek.exe `
                    -OutputDirectory target/portable-repeated

                  $firstArchives = @(
                    Get-ChildItem `
                    -LiteralPath target/portable-first `
                    -Filter '*.zip' |
                    Where-Object { -not $_.PSIsContainer }
                  )
                  $repeatedArchives = @(
                    Get-ChildItem `
                    -LiteralPath target/portable-repeated `
                    -Filter '*.zip' |
                    Where-Object { -not $_.PSIsContainer }
                  )
                  if ($firstArchives.Count -ne 1 -or $repeatedArchives.Count -ne 1) {
                      throw 'Portable packaging did not create exactly one archive per run.'
                  }
                  $first = $firstArchives[0]
                  $repeated = $repeatedArchives[0]
                  $firstHash = (Get-FileHash `
                    -Algorithm SHA256 `
                    -LiteralPath $first.FullName).Hash
                  $repeatedHash = (Get-FileHash `
                    -Algorithm SHA256 `
                    -LiteralPath $repeated.FullName).Hash
                  if ($firstHash -cne $repeatedHash) {
                      throw 'Repeated portable package generation was not deterministic.'
                  }

                  ./tools/Test-PortablePackage.ps1 `
                    -PackagePath $first.FullName

            - name: Upload release evidence
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: windows-x64-${{ github.sha }}
                  path: |
                      target/release/CursorPeek.exe
                      target/windows-quality/cargo-features.txt
                      target/windows-quality/release-evidence.json
                  if-no-files-found: error
                  retention-days: 14

[workspace]
members = [".", "crates/cursorpeek-core"]
resolver = "3"

[package]
name = "windows-cursorpeek"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
description = "A lightweight native hover-preview utility for Windows File Explorer"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[[bin]]
name = "CursorPeek"
path = "src/main.rs"

[features]
default = []
resolver-corpus = []

[dependencies]
chardetng = { version = "=1.0.0", default-features = false }
codepage = { version = "=0.1.2", default-features = false }
cursorpeek-core = { version = "=0.1.0", path = "crates/cursorpeek-core" }
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
image = { version = "=0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
windows = { version = "=0.62.2", features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = { version = "=0.3.1", default-features = false }

[build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

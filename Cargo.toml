[package]
name = "windows-cursorpeek"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A lightweight native hover-preview utility for Windows File Explorer"
publish = false

[[bin]]
name = "CursorPeek"
path = "src/main.rs"

[features]
default = []
resolver-corpus = []

[dependencies]
chardetng = { version = "=1.0.0", default-features = false }
codepage = { version = "=0.1.2", default-features = false }
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

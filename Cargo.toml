[package]
name = "windows-cursorpeek"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A lightweight native hover-preview utility for Windows File Explorer"
publish = false

[[bin]]
name = "CursorPeek"
path = "src/main.rs"

[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
